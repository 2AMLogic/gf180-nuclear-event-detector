name: smoke

# The harness smoke gate (issue #2): every PR and every push to main must
# prove, from a clean checkout, that the sim harness works -- the negative
# control (sim/smoke.sh step 1) and the recorded smoke run (step 2, which
# writes an append-only evidence record; CI does not commit it, the same way
# a local run's record stays a local artifact until a person commits it).
#
# Toolchain per sim/toolchain.json and sim/pdk.json: ngspice built from
# source at exactly the pinned major (apt ngspice on ubuntu-24.04 predates
# the floor), the PDK installed with ciel at the pinned open_pdks revision
# (the hash is parsed out of the pdk_version pin's "open_pdks <hash>" line,
# which the harness requires the install to match exactly). Caches make the
# steady-state run a few minutes; failures are real failures and are never
# swallowed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PDK_ROOT: ${{ github.workspace }}/.ci-pdk
    steps:
      - uses: actions/checkout@v4

      - name: Read pins from sim/toolchain.json and sim/pdk.json
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          t = json.load(open("sim/toolchain.json"))
          p = json.load(open("sim/pdk.json"))
          # These two values are written to $GITHUB_ENV (one per line) and
          # interpolated into later steps; a malformed value (e.g. a newline)
          # would inject extra env lines. Restrict both to a single safe
          # token before anything is written.
          PIN_RE = r"^[A-Za-z0-9._-]+$"
          for name, value in (("PDK", str(p["default_variant"])),
                              ("PYTHON_MIN", str(t["python_min"]))):
              if not re.fullmatch(PIN_RE, value):
                  sys.exit(f"invalid pin {name}={value!r}: must match {PIN_RE}")
          print(f"NGSPICE_VERSION={int(t['ngspice_min_major'])}")
          print(f"OPEN_PDKS={t['pdk_version'].split()[-1]}")
          print(f"PDK={p['default_variant']}")
          print(f"PYTHON_MIN={t['python_min']}")
          PY
          grep -E '^(NGSPICE_VERSION|OPEN_PDKS|PDK|PYTHON_MIN)=' "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python floor
        run: |
          python3 - <<PY
          import sys
          need = tuple(int(x) for x in "${PYTHON_MIN}".split("."))
          assert sys.version_info[:2] >= need, (sys.version, need)
          print("python", sys.version)
          PY

      - name: Install build prerequisites and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex \
            libx11-dev libxaw7-dev libxpm-dev libxrender-dev libxext-dev \
            libreadline-dev libfftw3-dev libcairo2-dev \
            tcl-dev tk-dev libxcb1-dev libxcb-render0-dev libxcb-shm0-dev \
            gawk curl ca-certificates

      - name: Cache ngspice
        id: cache-ngspice
        uses: actions/cache@v4
        with:
          path: ~/tools/ngspice
          key: ngspice-${{ runner.os }}-${{ runner.arch }}-${{ env.NGSPICE_VERSION }}-shared0-readline-v1

      - name: Build ngspice from source
        if: steps.cache-ngspice.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ngspice-src"
          cd "$RUNNER_TEMP/ngspice-src"
          # SourceForge moved superseded releases under old-releases/; the
          # bare ng-spice-rework/<ver>/ path 404s (seen on the sibling
          # gf180-comparator's CI from 2026-10-12).
          curl -fsSL -o ngspice.tar.gz \
            "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/old-releases/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}.tar.gz"
          sha256sum ngspice.tar.gz | tee ngspice.sha256
          mkdir src && tar -xzf ngspice.tar.gz -C src --strip-components=1
          cd src
          ./configure --prefix="$HOME/tools/ngspice" --with-readline=yes \
            --disable-debug --enable-openmp=no
          make -j2
          make install
          cp ../ngspice.sha256 "$HOME/tools/ngspice/SOURCE.sha256"

      - name: Expose ngspice and verify versions
        run: |
          set -euo pipefail
          # $GITHUB_PATH applies to SUBSEQUENT steps only; the in-step check
          # below needs the export too, or ngspice is not found (exit 127).
          echo "$HOME/tools/ngspice/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/tools/ngspice/bin:$PATH"
          echo "--- source identity"
          cat "$HOME/tools/ngspice/SOURCE.sha256" || true
          echo "--- version"
          ngspice --version | head -n 3

      - name: Cache PDK
        id: cache-pdk
        uses: actions/cache@v4
        with:
          path: .ci-pdk
          key: pdk-${{ runner.os }}-${{ env.OPEN_PDKS }}-${{ env.PDK }}-ciel-v1

      - name: Install ciel and enable the pinned open_pdks revision
        run: |
          set -euo pipefail
          python3 -m pip install ciel==2.6.1
          python3 -m pip --version
          ciel --version || true
          ciel enable --pdk-family gf180mcu --pdk-root "$PDK_ROOT" "$OPEN_PDKS"
          # Same validity test the harness applies: the variant directory must
          # contain the model .lib sim/pdk.json names.
          test -f "$PDK_ROOT/$PDK/libs.tech/ngspice/sm141064.ngspice" \
            || { echo "PDK variant $PDK under $PDK_ROOT lacks the model library" >&2; ls -la "$PDK_ROOT" >&2; exit 1; }
          cat "$PDK_ROOT/$PDK/SOURCES"
          echo "open_pdks: $OPEN_PDKS  variant: $PDK  root: $PDK_ROOT"

      - name: Harness smoke (negative control + recorded run)
        run: ./sim/smoke.sh

      - name: Upload scratch ngspice logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-scratch-logs
          path: |
            sim/smoke/_build
            sim/smoke/_selftest
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Verify the run mutated nothing tracked
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)" \
            || { echo "smoke run modified tracked files" >&2; git diff --stat >&2; exit 1; }
